name: PHP lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint PHP files
        run: |
          php -v
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  checks:
    name: index.php & clés reCAPTCHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.php dans chaque dossier + absence de clé réelle
        run: bash scripts/check-release.sh . --repo --no-lint

      - name: Construction du zip de release
        run: |
          bash scripts/build-zip.sh
          ls -l dist/

      - name: Archive du zip (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: websourcerecaptcha-zip
          path: dist/*.zip
          retention-days: 14
